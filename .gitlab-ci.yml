# GitLab CI/CD for the AWS WAFv2 Regional Web ACL.
#
# Flow:
#   validate  terraform fmt + validate on every branch and merge request
#   plan      only on the protected default branch; uploads the plan artifact
#   approval  blocking manual job; a human must approve after reviewing the plan
#   apply     only after plan AND approval; applies the stored plan, never a
#             freshly generated one
#
# Required CI/CD variables (mark them protected; mask the sensitive ones):
#   AWS_REGION       target Region (us-east-1 for CLOUDFRONT)
#   WAF_SCOPE        REGIONAL (ALB) or CLOUDFRONT
#   AWS_ROLE_ARN     IAM role assumed through GitLab OIDC
#   TF_STATE_BUCKET  existing bucket that stores Terraform state
#   TF_LOG_BUCKET    existing bucket that receives the WAF logs
#   ALB_ARN          ARN of the existing ALB; required only for REGIONAL
# Optional:
#   TF_STATE_REGION  Region of the state bucket, defaults to AWS_REGION
#
# The WAF policy itself (enabled rules, per-rule COUNT/BLOCK, rate limit, IP and
# geo lists, managed-rule overrides) comes from the policy file for the target:
#
#   env/regional/<AWS_REGION>.tfvars
#   env/cloudfront/<AWS_REGION>.tfvars
#
# Those files are reviewed and versioned per region. The plan job fails when the
# expected file is missing.
#
# Targets deploy independently: the state key includes scope and Region, and the
# environment is production/<scope>-<region>, so approvals are per target.

stages:
  - validate
  - plan
  - approval
  - apply

variables:
  TF_VERSION: "1.16.1"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  PLAN_FILE: "tfplan.bin"
  PLAN_TEXT: "tfplan.txt"
  PLAN_CHECKSUM: "tfplan.sha256"

default:
  image:
    name: "hashicorp/terraform:${TF_VERSION}"
    entrypoint: [""]
  before_script:
    - apk add --no-cache aws-cli >/dev/null

# ---------------------------------------------------------------------------
# Validation: every branch and merge request
# ---------------------------------------------------------------------------

fmt:
  stage: validate
  script:
    - terraform fmt -check -recursive -diff
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

validate:
  stage: validate
  script:
    - terraform init -backend=false -input=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Plan: protected default branch only
# ---------------------------------------------------------------------------

plan:
  stage: plan
  id_tokens:
    AWS_ID_TOKEN:
      aud: "https://gitlab.com"
  resource_group: "waf-plan-${WAF_SCOPE}-${AWS_REGION}"
  script:
    - ./scripts/tf-plan.sh
  artifacts:
    name: "waf-plan-${WAF_SCOPE}-${AWS_REGION}-${CI_PIPELINE_IID}"
    paths:
      - "${PLAN_FILE}"
      - "${PLAN_TEXT}"
      - "${PLAN_CHECKSUM}"
    expire_in: 1 day
    access: maintainer
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Approval: blocking manual gate between plan and apply
# ---------------------------------------------------------------------------

approval:
  stage: approval
  script:
    - echo "Plan for ${WAF_SCOPE} ${AWS_REGION} approved by ${GITLAB_USER_LOGIN}."
  when: manual
  allow_failure: false
  environment:
    name: "production/${WAF_SCOPE}-${AWS_REGION}"
    action: prepare
  needs:
    - job: plan
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# Apply: same approved plan file, no new plan
# ---------------------------------------------------------------------------

apply:
  stage: apply
  id_tokens:
    AWS_ID_TOKEN:
      aud: "https://gitlab.com"
  resource_group: "waf-apply-${WAF_SCOPE}-${AWS_REGION}"
  environment:
    name: "production/${WAF_SCOPE}-${AWS_REGION}"
    deployment_tier: production
  needs:
    - job: plan
      artifacts: true
    - job: approval
      artifacts: false
  script:
    # Applies the approved plan file; never creates a new plan.
    - ./scripts/tf-apply.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
